<style>
/* VOICE: confident phone-banking app, quick to read, a little swagger
   IDEA: a neobank home screen - balance card, spend ring, stacked rounded cards
   PICTURE: coral hero card with a huge "left to spend" figure and a budget ring
   COLOUR and TYPE: charcoal night ground, coral accent, mint for money in; Plus Jakarta Sans with heavy numerals
   LAYOUT: sidebar nav on desktop, bottom tab bar on phones, card grid */
:root{color-scheme:light dark;--bg:light-dark(#f2f2f5,#0e0f12);--card:light-dark(#fff,#191b20);--card2:light-dark(#f0f0f3,#23262d);--ink:light-dark(#121316,#f4f4f6);--mute:light-dark(#686c75,#9b9fa9);--rule:light-dark(#e7e7eb,#2a2d35);--acc:#ff6a4d;--onacc:#1d0c07;--accsoft:light-dark(#ffe7e0,#3a1e18);--in:light-dark(#0c9a63,#4fe0a0);--insoft:light-dark(#dcf5ea,#14302a);--red:light-dark(#d4281c,#ff7b70);--rsoft:light-dark(#fde6e3,#3b1a18);--spend:light-dark(#c8cbd2,#3c4049);--r:20px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip;display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
a{color:var(--acc)}
.side{position:sticky;top:0;height:100vh;padding:26px 14px;background:var(--card);border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:26px}
.logo{display:flex;align-items:center;gap:10px;padding:0 10px;font-weight:800;font-size:22px;letter-spacing:-.02em}
.logo i{width:34px;height:34px;border-radius:11px;background:var(--acc);color:var(--onacc);display:grid;place-items:center;font-style:normal;font-size:19px}
.side .safe{margin-top:auto;font-size:13px;color:var(--mute);padding:0 10px;display:flex;gap:8px}
.side .safe svg{flex:none;margin-top:2px}
nav{display:flex;flex-direction:column;gap:4px}
nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--mute);text-decoration:none;font-weight:600;min-height:44px}
nav a svg{width:21px;height:21px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav a:hover{background:var(--card2);color:var(--ink)}
nav a.on{background:var(--accsoft);color:var(--ink)}nav a.on svg{stroke:var(--acc)}
main{max-width:1180px;width:100%;margin:0 auto;padding:calc(clamp(20px,3vw,40px) + env(safe-area-inset-top)) clamp(16px,3vw,40px) 90px}

@media(max-width:760px){body{grid-template-columns:1fr}.side{position:fixed;inset:auto 0 0 0;height:auto;z-index:15;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--rule);gap:0}.side .logo,.side .safe,.side .syncpill{display:none!important}nav{flex-direction:row;justify-content:space-around;gap:0}nav a{flex:1 1 0;flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;text-align:center}nav a.on{background:none}nav a.on span{color:var(--acc)}main{padding-bottom:110px}.mtop{display:flex!important}}
.mtop{display:none;align-items:center;gap:10px;font-weight:800;font-size:20px;margin-bottom:14px}.mtop i{width:30px;height:30px;border-radius:10px;background:var(--acc);color:var(--onacc);display:grid;place-items:center;font-style:normal;font-size:16px}

.pos{color:var(--in);font-weight:600}.red{color:var(--red)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--card2);color:var(--mute);margin:2px 4px 2px 0;white-space:nowrap}

.toolbar input[type=search]{flex:1 1 220px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px;margin:0 0 18px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--mute)}

.panel{background:var(--card);border-radius:var(--r);padding:22px;margin-bottom:18px}
.rec{background:var(--card);border-radius:18px;padding:16px 18px;margin-bottom:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px}
.rec h3{margin:0;font-size:17px;font-weight:700}
.rec .amt{font-weight:800;font-size:22px;letter-spacing:-.02em;text-align:right;white-space:nowrap}
.rec .amt small{display:block;font-size:13px;font-weight:500;color:var(--mute);letter-spacing:0}
.rec .meta{color:var(--mute);font-size:14px}
.rec .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.rec details{grid-column:1/-1;font-size:14px;color:var(--mute)}
.rec details summary{cursor:pointer;min-height:32px;display:flex;align-items:center;font-weight:600}
.rec.dim{opacity:.55}
details>summary.btn{list-style:none}details>summary.btn::-webkit-details-marker{display:none}details[open]>summary.btn{display:none}
section{margin-top:30px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:16px;display:none;gap:12px;align-items:center;width:max-content;max-width:calc(100vw - 32px);z-index:20;flex-wrap:wrap;font-size:15px;font-weight:500;box-shadow:0 10px 30px rgb(0 0 0/.25)}
@media(max-width:760px){#toast{bottom:90px}}
#toast.on{display:flex}
#toast button{background:var(--acc);color:var(--onacc);min-height:36px}
#modal{position:fixed;inset:0;background:rgb(0 0 0/.55);display:none;place-items:center;z-index:30;padding:16px}

#modal>div{background:var(--card);border-radius:22px;padding:24px;max-width:440px;width:100%}
#modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
pre,.scroll{overflow-x:auto}code{overflow-wrap:anywhere;background:var(--card2);padding:2px 6px;border-radius:6px;font-size:14px}
@media(max-width:600px){table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--rule)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute);font-size:13px}.stack td:empty{display:none}.stack td.num{text-align:start}.stack tfoot td{border:0}}
</style><script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script></head><body>

<script>
{
/* ---------- helpers ---------- */
const LS='tally-budget-v1';
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());
const dn=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/864e5;
const nd=n=>iso(new Date(Math.round(n)*864e5));
const addDays=(s,k)=>nd(dn(s)+k);
const addMonths=(s,k)=>{let y=+s.slice(0,4),m=+s.slice(5,7)-1+k;const d=+s.slice(8,10);y+=Math.floor(m/12);m=((m%12)+12)%12;const last=new Date(Date.UTC(y,m+1,0)).getUTCDate();return y+'-'+pad(m+1)+'-'+pad(Math.min(d,last))};
const now=new Date();
const TODAY=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
const ym=s=>s.slice(0,7);
const monthName=(k,short)=>new Date(Date.UTC(+k.slice(0,4),+k.slice(5,7)-1,1)).toLocaleDateString('en-AU',short?{month:'short',timeZone:'UTC'}:{month:'long',year:'numeric',timeZone:'UTC'});
const dayLabel=s=>new Date(dn(s)*864e5).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
const A2=new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD'});
const A0=new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0});
const m2=n=>A2.format(n),m0=n=>A0.format(Math.round(n));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const median=a=>{const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const sum=a=>a.reduce((x,y)=>x+y,0);
const title=s=>s.toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase());

/* ---------- defaults ---------- */
const DEF_CATS=[['salary','Salary & wages','income',0],['otherinc','Other income & refunds','income',0],['housing','Mortgage & rent','expense',2900],['groceries','Groceries','expense',1500],['utilities','Power, gas & water','expense',320],['phone','Phone & internet','expense',160],['insurance','Insurance & health cover','expense',620],['transport','Fuel & transport','expense',450],['childcare','Childcare & school','expense',950],['kids','Kids activities','expense',120],['health','Health & pharmacy','expense',100],['dining','Eating out & takeaway','expense',350],['subs','Subscriptions','expense',80],['shopping','Shopping & household','expense',400],['car','Car (rego, service)','expense',120],['rates','Council rates','expense',170],['fun','Entertainment','expense',100],['gifts','Gifts','expense',60],['other','Other spending','expense',150],['transfer','Transfers & savings','transfer',0]];
const DEF_RULES=[['SALARY|PAYROLL|WAGES','salary'],['TRANSFER|TFR|SAVINGS|INTERNAL','transfer'],['HOME LOAN|MORTGAGE|LOAN REPAYMENT|RENT','housing'],['WOOLWORTHS|COLES|ALDI|IGA|HARRIS FARM|COSTCO|FOODWORKS','groceries'],['AGL|ORIGIN|ENERGYAUSTRALIA|RED ENERGY|ALINTA|HUNTER WATER|SYDNEY WATER|JEMENA|ENGIE|SIMPLY ENERGY','utilities'],['TELSTRA|OPTUS|VODAFONE|TPG|AUSSIE BROADBAND|BELONG|IINET|BOOST|AMAYSIM','phone'],['NRMA|AAMI|BUDGET DIRECT|ALLIANZ|YOUI|SUNCORP|GIO|QBE|MEDIBANK|BUPA|NIB|HCF|AHM','insurance'],['AMPOL|CALTEX|BP|SHELL|7-ELEVEN|UNITED PETROLEUM|METRO PETROLEUM|LINKT|TRANSPORT FOR NSW|OPAL|DIDI','transport'],['GOODSTART|CHILDCARE|EARLY LEARNING|OSHC|SCHOOL|UNIFORM','childcare'],['SWIM|SWIMSTARS|DANCE|FOOTBALL|SOCCER|NETBALL|GYMNASTICS|MUSIC LESSON','kids'],['CHEMIST|PHARMACY|PRICELINE|MEDICAL|DENTAL|DOCTOR|PHYSIO|PATHOLOGY','health'],['UBER EATS|MENULOG|DOORDASH|MCDONALDS|KFC|HUNGRY JACKS|DOMINOS|CAFE|PIZZA|SUSHI|RESTAURANT|BAKERY','dining'],['NETFLIX|SPOTIFY|STAN|DISNEY|BINGE|KAYO|YOUTUBE|APPLE.COM|GOOGLE ONE|AMAZON PRIME|PARAMOUNT|ICLOUD','subs'],['KMART|BIG W|TARGET|BUNNINGS|MYER|DAVID JONES|IKEA|OFFICEWORKS|AMAZON|JB HI-FI|HARVEY NORMAN','shopping'],['REGO|SERVICE NSW|MECHANIC|TYRES|GREEN SLIP','car'],['RATES|COUNCIL','rates'],['CINEMA|CINEMAS|HOYTS|TICKETEK|TICKETMASTER|STEAM|PLAYSTATION','fun'],['GIFT|TOYWORLD','gifts']];

/* ---------- merchant + rules ---------- */
const NOISE=/\b(VISA|DEBIT|CREDIT|PURCHASE|EFTPOS|POS|CARD|DIRECT|DD|BPAY|OSKO|NPP|PAYMENT|PAYMENTS|TO|FROM|AUTHORISATION|PENDING|VALUE|DATE|AUD|AU|AUS|AUSTRALIA|NSW|VIC|QLD|SA|WA|TAS|ACT|NT|REF|RECEIPT|INTERNET|TRANSFER|TFR|PTY|LTD|THE|WWW|COM|NET|ORG|INV|NO|SP|SQ)\b/g;

function parseCSV(text){

    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}

  try{await loadGIS();
    tc=google.accounts.oauth2.initTokenClient({client_id:cid(),scope:SCOPE,
      callback:r=>{if(r.error){setSync('err',r.error_description||r.error);return}tok=r.access_token;tokExp=Date.now()+((+r.expires_in||3600)-120)*1000;SY.on=true;saveSY();syncNow()},
      error_callback:e=>setSync(SY.on?'need':'',e&&e.type==='popup_closed'?'Sign-in was closed':'Sign-in failed, try again')});
    tcReady=true;
  }catch(e){setSync('err',e.message)}
}
function signIn(){if(!cid()){go('rules');toast('Add your Google client ID first.');return}if(!tcReady){initGIS().then(()=>tcReady&&toast('Ready. Tap sync again to sign in.'));return}tc.requestAccessToken({prompt:SY.on?'':'consent'})}
async function api(u,o={}){const r=await fetch(u,{...o,headers:{...(o.headers||{}),Authorization:'Bearer '+tok}});if(!r.ok){const e=new Error('Google Drive said '+r.status);e.status=r.status;throw e}return r}
function schedSync(){if(!tokOK())return;clearTimeout(stT);stT=setTimeout(syncNow,2000)}
async function syncNow(){
  if(!tokOK()){tok=null;if(SY.on)setSync('need');return}
  if(syncing){again=true;return}
  syncing=true;setSync('busy');
  try{
    if(S.txns.length&&S.txns.every(t=>t.sample)){S.txns=[];S.recur={};persist()}
    let id=SY.fid,m=null;
    if(id){try{m=await(await api(`${D}/files/${id}?fields=id,modifiedTime,trashed`)).json();if(m.trashed){id=null;m=null}}catch(e){if(e.status===404){id=null}else throw e}}
    if(!id){const l=await(await api(`${D}/files?q=${encodeURIComponent(`name='${FNAME}' and trashed=false`)}&orderBy=modifiedTime%20desc&fields=files(id,modifiedTime)&spaces=drive`)).json();if(l.files&&l.files.length){m=l.files[0];id=m.id}}
    let push=dirty||!id||!!SY.force;
    if(id&&!SY.force&&m.modifiedTime!==SY.rmt){
      const R=await(await api(`${D}/files/${id}?alt=media`)).json();
      if(R&&Array.isArray(R.txns)){const before=JSON.stringify(clean(S));S=merge(S,R);persist();if(JSON.stringify(clean(S))!==before){U.month=null;render()}push=JSON.stringify(clean(S))!==JSON.stringify(R)}
    }
    if(push){
      dirty=false;const body=JSON.stringify(clean(S));let r;
      if(id)r=await(await api(`${UP}/files/${id}?uploadType=media&fields=id,modifiedTime`,{method:'PATCH',headers:{'Content-Type':'application/json'},body})).json();
      else{const b='tally'+Date.now();r=await(await api(`${UP}/files?uploadType=multipart&fields=id,modifiedTime`,{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name:FNAME,mimeType:'application/json',description:'Tally family budget data. Shared by your phones; do not edit by hand.'})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`})).json()}
      id=r.id;m=r;
    }
    SY.fid=id;SY.rmt=m.modifiedTime;SY.force=false;SY.last=Date.now();saveSY();setSync('ok');
  }catch(e){if(e.status===401||e.status===403&&!tokOK()){tok=null;setSync('need')}else setSync('err',e.message||'Sync failed')}
  finally{syncing=false;if(again){again=false;syncNow()}}
}
function setSync(st,msg){syncState=st;syncMsg=msg||'';pill();if(U.view==='rules'&&!document.activeElement?.matches('input,textarea'))render()}
function pill(){
  const t={need:'Tap to sync',busy:'Syncing…',ok:'Synced '+(SY.last?new Date(SY.last).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'}):''),err:'Sync problem · retry'}[syncState];
  document.querySelectorAll('.syncpill').forEach(b=>{b.hidden=!t;b.textContent=t||'';b.className='syncpill sm'+(syncState==='need'||syncState==='err'?' pri':'')});
}
addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&tokOK())syncNow()});
setInterval(()=>{if(document.visibilityState==='visible'&&tokOK()&&!syncing)syncNow()},60000);

/* ---------- render + routing ---------- */
function render(){setTimeout(pill);
  const h=location.hash.slice(1);U.view=V[h]?h:'overview';
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+U.view));
  $('#main').innerHTML=V[U.view]();
}
addEventListener('hashchange',()=>{render();scrollTo(0,0)});
const go=v=>{if(location.hash==='#'+v)render();else location.hash=v};

/* ---------- actions ---------- */
const ACT={
  myes(){$('#modal').classList.remove('on');const f=mcb;mcb=null;f&&f()},
  mno(){$('#modal').classList.remove('on');mcb=null},
  pickmonth(el,e){e.preventDefault();U.month=el.dataset.k;render()},
  clearsample(){ask('Remove the sample data and start with an empty budget?','Start empty',()=>{S.txns=S.txns.filter(t=>!t.sample);S.recur={};save();render()})},
  showunc(){U.fcat='__none';U.fmon=curMonth();U.q='';U.limit=200;go('transactions')},
  more(){U.limit+=200;$('#txwrap').innerHTML=txTable()},
  del(el){const t=S.txns.find(x=>x.id===el.dataset.id);if(!t)return;ask(`Delete "${t.desc}" (${m2(t.amt)}) on ${dayLabel(t.date)}?`,'Delete',()=>{S.txns=S.txns.filter(x=>x!==t);(S.del=S.del||[]).push(t.id);save();$('#txwrap').innerHTML=txTable()})},
  rc(el){S.recur[el.dataset.k]=el.dataset.s;if(el.dataset.s==='detected')delete S.recur[el.dataset.k];save();render()},
  rshow(el){U.rshow=el.dataset.v;render()},
  useavg(){const av=avg3(curMonth());S.cats.forEach(c=>{if(c.type==='expense'){c.budget=Math.ceil((av.by[c.id]||0)/10)*10;c.mt=Date.now()}});save();render();toast('Budgets set from your recent averages.')},
  pcommit(){const p=U.pending;commitImport(buildRows(p).out,p.acct.trim()||'Account');U.pending=null;nextFile()},
  pcancel(){U.pending=null;nextFile()},
  addrule(){const m=$('#rmatch').value.trim(),c=$('#rcat').value;if(!m||!c){toast('Enter some words and pick a category.');return}S.rules.unshift({id:uid(),match:m,cat:c});const n=applyRules();save();render();toast(`Rule added. ${n} transaction${n===1?'':'s'} recategorised.`)},
  delrule(el){S.rules=S.rules.filter(r=>r.id!==el.dataset.id);(S.del=S.del||[]).push(el.dataset.id);save();render()},
  reapply(){const n=applyRules();save();render();toast(`${n} transaction${n===1?'':'s'} changed.`)},
  addcat(){const n=$('#cname').value.trim();if(!n)return;S.cats.push({id:'c'+uid(),name:n,type:$('#ctype').value,budget:0});save();render()},
  delcat(el){const c=C(el.dataset.id),used=S.txns.filter(t=>t.cat===c.id).length;ask(`Remove "${c.name}"?${used?` ${used} transactions will become uncategorised.`:''} Rules using it are removed too.`,'Remove',()=>{S.del=S.del||[];S.del.push(c.id,...S.rules.filter(r=>r.cat===c.id).map(r=>r.id));S.cats=S.cats.filter(x=>x!==c);S.txns.forEach(t=>{if(t.cat===c.id){t.cat='';t.manual=false;t.mt=Date.now()}});S.rules=S.rules.filter(r=>r.cat!==c.id);save();render()})},
  dl(){try{const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tally-backup-'+TODAY+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup downloaded. If nothing appeared, use Copy backup instead.')}catch(e){toast('Download blocked here. Use Copy backup instead.')}},
  copy(){navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast('Backup copied. Paste it into a text file and keep it somewhere safe.'),()=>{$('#paste').value=JSON.stringify(S);$('#paste').select();toast('Copy was blocked, so the backup is in the box below. Select all and copy it.')})},
  sample(){if(SY.on){toast('Disconnect sync on this phone before loading sample data.');return}ask('Replace everything with sample data? Take a backup first if you have your own data loaded.','Load sample',()=>{S=fresh(true);U.month=null;save();go('overview')})},
  erase(){ask(SY.on?'Erase every transaction on both phones? This cannot be undone.':'Erase every transaction, rule and budget in this browser? This cannot be undone.','Erase everything',()=>{if(SY.on){S.del=[...(S.del||[]),...S.txns.map(t=>t.id)];S.txns=[];S.recur={}}else S=fresh(false);U.month=null;save();go('import')})},
  restore(){restoreFrom($('#paste').value)},
  sync(){if(tokOK())syncNow();else signIn()},
  connect(){const i=$('#cid');if(i){const v=i.value.trim();if(!v){toast('Paste your Google client ID first.');return}if(v!==SY.cid){SY.cid=v;saveSY();tcReady=false;initGIS().then(()=>{if(tcReady){toast('Ready. Tap Connect again to sign in.');render()}});return}}if(tokOK())syncNow();else signIn()},
  disconnect(){ask('Stop syncing on this phone? Your data stays here and in Google Drive.','Disconnect',()=>{try{tok&&google.accounts.oauth2.revoke(tok,()=>{})}catch(e){}tok=null;SY={cid:SY.cid};saveSY();setSync('');render()})}
};
function applyRules(){let n=0;for(const t of S.txns){if(t.manual)continue;const c=autoCat(t,S.rules);if(c!==t.cat){t.cat=c;t.mt=Date.now();n++}}return n}
function restoreFrom(txt){try{const s=JSON.parse(txt);if(!s||!Array.isArray(s.txns)||!Array.isArray(s.cats))throw 0;ask(`Replace what's here with this backup (${s.txns.length} transactions)?`,'Restore',()=>{S=s;S.recur=S.recur||{};S.rules=S.rules||[];if(SY.on){SY.force=true;saveSY()}U.month=null;save();go('overview');toast('Backup restored.')})}catch(e){toast("That doesn't look like a Tally backup.")}}
const CHG={
  month(el){U.month=el.value;render()},
  fcat(el){U.fcat=el.value;U.limit=200;$('#txwrap').innerHTML=txTable()},
  fmon(el){U.fmon=el.value;U.limit=200;$('#txwrap').innerHTML=txTable()},
  facct(el){U.facct=el.value;U.limit=200;$('#txwrap').innerHTML=txTable()},
  tcat(el){const t=S.txns.find(x=>x.id===el.dataset.id);if(!t)return;t.cat=el.value;t.manual=true;t.mt=Date.now();save();
    const m=merch(t.desc),others=S.txns.filter(x=>x!==t&&!x.manual&&merch(x.desc)===m&&x.cat!==t.cat).length;
    if(el.value)toast(`Always file "${title(m)}" as ${catName(el.value)}?${others?` (${others} others)`:''}`,'Make it a rule',()=>{S.rules.unshift({id:uid(),match:m,cat:t.cat});const n=applyRules();save();$('#txwrap')&&($('#txwrap').innerHTML=txTable());toast(`Rule saved. ${n} more transaction${n===1?'':'s'} updated.`)})},
  bud(el){const c=C(el.dataset.id);c.budget=Math.max(0,+el.value||0);c.mt=Date.now();save();render()},
  files(el){handleFiles(el.files)},
  pacct(el){U.pending.acct=el.value},
  pmap(el){const f=el.dataset.f,v=+el.value;U.pending.map[f]=v;if(f==='amt'&&v>=0){U.pending.map.debit=-1;U.pending.map.credit=-1}if((f==='debit'||f==='credit')&&v>=0)U.pending.map.amt=-1;render()},
  pfmt(el){U.pending.fmt=el.value;render()},
  phead(el){U.pending.hasHeader=el.checked;render()},
  pinv(el){U.pending.invert=el.checked;render()}
};
let qt;const INP={q(el){U.q=el.value;U.limit=200;clearTimeout(qt);qt=setTimeout(()=>{$('#txwrap').innerHTML=txTable()},150)}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&ACT[el.dataset.a])ACT[el.dataset.a](el,e)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(el&&CHG[el.dataset.c])CHG[el.dataset.c](el,e)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-i]');if(el&&INP[el.dataset.i])INP[el.dataset.i](el)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').classList.contains('on'))ACT.mno()});

/* ---------- files ---------- */
function handleFiles(fl){U.queue.push(...Array.from(fl||[]));if(!U.pending)nextFile()}
async function nextFile(){
  const f=U.queue.shift();
  if(!f){go('import');return}
  let text='';try{text=await f.text()}catch(e){toast(`Couldn't read ${f.name}.`);return nextFile()}
  if(/\.json$/i.test(f.name)||/^\s*\{/.test(text)){restoreFrom(text);return nextFile()}
  if(/<OFX>|OFXHEADER|<STMTTRN>/i.test(text)){const l=parseOFX(text);if(!l.length)toast(`No transactions found in ${f.name}.`);else commitImport(l,title(f.name.replace(/\.[^.]+$/,'').replace(/[_\-]+/g,' ')).slice(0,32));return nextFile()}
  const rows=parseCSV(text);
  if(rows.length<1){toast(`${f.name} looks empty.`);return nextFile()}
  U.pending=autoMap(rows,f.name);go('import');
}
addEventListener('dragover',e=>{e.preventDefault();$('#drop')?.classList.add('over')});
addEventListener('dragleave',e=>{if(!e.relatedTarget)$('#drop')?.classList.remove('over')});
addEventListener('drop',e=>{e.preventDefault();$('#drop')?.classList.remove('over');if(e.dataTransfer?.files?.length)handleFiles(e.dataTransfer.files)});

persist();render();pill();if(cid())initGIS();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body></html>
